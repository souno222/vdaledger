
#Client Origin
frontend.origin=${FRONTEND_ORIGIN}


#PostgresQL variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/vda_ledger}
spring.datasource.username=${DB_USERNAME:vda_admin}
spring.datasource.password=${DB_PASSWORD:vda_password}

#Redis variables
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

#Clerk variables
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URI:http://localhost:9999/.well-known/jwks.json}
app.security.clerk-issuer=${CLERK_ISSUER_URI:http://localhost:9999}
app.clerk.secret-key=${CLERK_SECRET_KEY}
app.clerk.webhook-signing-secret=${CLERK_WEBHOOK_SECRET_KEY}
app.clerk.backend-api-url=${CLERK_BACKEND_API_URL:https://api.clerk.com/v1}
